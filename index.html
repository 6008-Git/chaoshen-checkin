<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>超神签到系统</title>
<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Microsoft Yahei", sans-serif;
}
body{
    background: #0b101c;
    padding: 16px;
    color: #e6edf7;
    background-image:
        radial-gradient(rgba(0, 140, 255, 0.08) 1px, transparent 1px);
    background-size: 24px 24px;
}
/* 闪烁炫彩大标题 */
.flash-title{
    font-size: 40px;
    font-weight: 900;
    text-align: center;
    margin-bottom: 20px;
    animation: flashColor 1.2s infinite alternate;
    letter-spacing: 4px;
}
@keyframes flashColor{
    0%{
        color: #ff4757;
        text-shadow: 0 0 12px #ff4757;
    }
    25%{
        color: #ffa502;
        text-shadow: 0 0 12px #ffa502;
    }
    50%{
        color: #2ed573;
        text-shadow: 0 0 12px #2ed573;
    }
    75%{
        color: #1e90ff;
        text-shadow: 0 0 12px #1e90ff;
    }
    100%{
        color: #ff6bff;
        text-shadow: 0 0 12px #ff6bff;
    }
}
.title{
    text-align: center;
    font-size: 24px;
    margin-bottom: 20px;
    letter-spacing: 2px;
    color: #36ccff;
    text-shadow: 0 0 8px #00aaff77;
}
.card{
    background: rgba(16, 26, 48, 0.85);
    border: 1px solid #0077cc66;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 22px;
    box-shadow: 0 0 12px #0066bb33, inset 0 0 20px #00336622;
}
.card-head{
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
}
.card-head h2{
    font-size: 18px;
    color: #66ddff;
}
.month-switch{
    display: flex;
    gap: 10px;
}
.btn{
    padding: 6px 14px;
    border: 1px solid #00a0ee;
    background: transparent;
    color: #36ccff;
    border-radius: 6px;
    cursor: pointer;
    transition: 0.3s ease;
}
.btn:hover{
    background: #0088cc33;
    box-shadow: 0 0 6px #00aaff66;
}
.btn:disabled{
    border-color: #224466;
    color: #446688;
    cursor: not-allowed;
}
.task-open-btn{
    width: 100%;
    padding: 12px;
    font-size: 16px;
    margin-top: 8px;
}
.week-row{
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    margin-bottom: 8px;
}
.week-cell{
    text-align: center;
    padding: 8px 0;
    color: #88bbdd;
    font-size: 14px;
}
.date-grid{
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
}
.day-cell{
    aspect-ratio: 1;
    border: 1px solid #00559944;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: .25s;
    font-size: 15px;
}
.day-cell:hover{
    border-color: #00bfff;
    background: #00447722;
}
.day-cell.signed{
    background: #16a34a;
    border-color: #22c55e;
    color: #ffffff;
    box-shadow: 0 0 8px #16a34a88;
}
.empty-cell{
    border: none;
    cursor: default;
    background: transparent;
}
/* 弹窗遮罩层 */
.mask{
    position: fixed;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.75);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 999;
}
.mask.show{
    display: flex;
}
.pop-box{
    width: 100%;
    max-width: 500px;
    background: #101a30;
    border: 1px solid #0077cc66;
    border-radius: 14px;
    padding: 20px;
}
.pop-title{
    font-size: 18px;
    color: #66ddff;
    margin-bottom: 16px;
    text-align: center;
}
.task-item{
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 0;
    border-bottom: 1px solid #00447744;
    gap: 10px;
}
.task-item:last-child{
    border-bottom: none;
}
.task-left{
    display: flex;
    align-items: center;
    gap: 10px;
}
.task-emoji{
    font-size: 18px;
}
.task-del{
    font-size: 13px;
    padding: 4px 10px;
    border: 1px solid #ff4466;
    color: #ff6680;
    border-radius: 4px;
    cursor: pointer;
}
.task-del.disabled{
    visibility: hidden;
}
.task-add-area{
    display: flex;
    gap: 10px;
    margin-top: 16px;
}
.task-input{
    flex: 1;
    padding: 9px 12px;
    background: #0f1a30;
    border: 1px solid #0066aa77;
    border-radius: 6px;
    color: #e6edf7;
    outline: none;
}
.task-input:focus{
    border-color: #00ccff;
    box-shadow: 0 0 5px #00aaff55;
}
.pop-close{
    width: 100%;
    margin-top: 20px;
}
.tip-text{
    text-align: center;
    margin-top: 10px;
    font-size: 13px;
    color: #6688aa;
}

/* 签到成功弹窗 */
.success-modal{
    position: fixed;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.8);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    animation: fadeIn 0.3s ease;
}
.success-modal.show{
    display: flex;
}
@keyframes fadeIn{
    from{ opacity: 0; }
    to{ opacity: 1; }
}
.success-box{
    background: linear-gradient(145deg, #1a2a4a, #0d1a30);
    border: 2px solid #00ffaa;
    border-radius: 20px;
    padding: 40px 30px;
    text-align: center;
    box-shadow: 0 0 60px #00ffaa55, 0 0 100px #00aaff33;
    animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    position: relative;
    overflow: hidden;
}
@keyframes popIn{
    0%{ transform: scale(0.5); opacity: 0; }
    100%{ transform: scale(1); opacity: 1; }
}
.success-icon{
    width: 80px;
    height: 80px;
    margin: 0 auto 20px;
    background: linear-gradient(135deg, #00ff88, #00ccff);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: pulse 1s infinite, rotateGlow 2s infinite linear;
    box-shadow: 0 0 30px #00ffaa;
}
@keyframes pulse{
    0%, 100%{ transform: scale(1); }
    50%{ transform: scale(1.1); }
}
@keyframes rotateGlow{
    0%{ box-shadow: 0 0 30px #00ffaa, 0 0 60px #00aaff; }
    50%{ box-shadow: 0 0 50px #00ffcc, 0 0 80px #00ccff; }
    100%{ box-shadow: 0 0 30px #00ffaa, 0 0 60px #00aaff; }
}
.success-icon svg{
    width: 45px;
    height: 45px;
    stroke: white;
    stroke-width: 3;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    animation: drawCheck 0.5s ease 0.3s forwards;
    stroke-dasharray: 50;
    stroke-dashoffset: 50;
}
@keyframes drawCheck{
    to{ stroke-dashoffset: 0; }
}
.success-title{
    font-size: 28px;
    font-weight: 900;
    color: #00ffaa;
    text-shadow: 0 0 20px #00ffaa;
    margin-bottom: 10px;
    animation: glowText 1.5s infinite alternate;
}
@keyframes glowText{
    from{ text-shadow: 0 0 10px #00ffaa, 0 0 20px #00ffaa; }
    to{ text-shadow: 0 0 20px #00ffcc, 0 0 40px #00ffaa, 0 0 60px #00aaff; }
}
.success-date{
    font-size: 16px;
    color: #88ccff;
    margin-bottom: 15px;
}
.success-msg{
    font-size: 14px;
    color: #aabbcc;
    margin-bottom: 25px;
    line-height: 1.6;
}
.success-close-btn{
    padding: 12px 40px;
    background: linear-gradient(135deg, #00ff88, #00ccff);
    border: none;
    border-radius: 25px;
    color: #001a22;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
    box-shadow: 0 4px 15px #00ffaa55;
}
.success-close-btn:hover{
    transform: scale(1.05);
    box-shadow: 0 6px 25px #00ffaa;
}

/* 粒子效果 */
.particle{
    position: absolute;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    animation: particleFly 1s ease-out forwards;
}
@keyframes particleFly{
    0%{ transform: translate(0, 0) scale(1); opacity: 1; }
    100%{ transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
}

/* 星星闪烁 */
.stars{
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    overflow: hidden;
}
.star{
    position: absolute;
    width: 4px;
    height: 4px;
    background: #fff;
    border-radius: 50%;
    animation: twinkle 1s infinite;
}
@keyframes twinkle{
    0%, 100%{ opacity: 0.3; transform: scale(1); }
    50%{ opacity: 1; transform: scale(1.5); }
}

/* 取消签到的提示 */
.cancel-modal .success-box{
    border-color: #ff6b6b;
    box-shadow: 0 0 60px #ff6b6b55;
}
.cancel-modal .success-icon{
    background: linear-gradient(135deg, #ff6b6b, #ff8e53);
    box-shadow: 0 0 30px #ff6b6b;
}
.cancel-modal .success-title{
    color: #ff6b6b;
    text-shadow: 0 0 20px #ff6b6b;
}
.cancel-modal .success-close-btn{
    background: linear-gradient(135deg, #ff6b6b, #ff8e53);
    box-shadow: 0 4px 15px #ff6b6b55;
}

/* 红色签到 */
.day-cell.signed-red{
    background: #dc2626;
    border-color: #ef4444;
    color: #ffffff;
    box-shadow: 0 0 8px #dc262688;
}
.success-modal.red .success-box{
    border-color: #ff4444;
    box-shadow: 0 0 60px #ff444455, 0 0 100px #ff660033;
}
.success-modal.red .success-icon{
    background: linear-gradient(135deg, #ff4444, #ff6600);
    box-shadow: 0 0 30px #ff4444;
}
.success-modal.red .success-title{
    color: #ff6666;
    text-shadow: 0 0 20px #ff4444;
    animation: glowTextRed 1.5s infinite alternate;
}
@keyframes glowTextRed{
    from{ text-shadow: 0 0 10px #ff4444, 0 0 20px #ff4444; }
    to{ text-shadow: 0 0 20px #ff6666, 0 0 40px #ff4444, 0 0 60px #ff6600; }
}
.success-modal.red .success-close-btn{
    background: linear-gradient(135deg, #ff4444, #ff6600);
    box-shadow: 0 4px 15px #ff444455;
}

/* 黄色签到 */
.day-cell.signed-yellow{
    background: #d97706;
    border-color: #f59e0b;
    color: #ffffff;
    box-shadow: 0 0 8px #d9770688;
}
.success-modal.yellow .success-box{
    border-color: #ffaa00;
    box-shadow: 0 0 60px #ffaa0055, 0 0 100px #ffcc0033;
}
.success-modal.yellow .success-icon{
    background: linear-gradient(135deg, #ffaa00, #ffcc00);
    box-shadow: 0 0 30px #ffaa00;
}
.success-modal.yellow .success-title{
    color: #ffcc00;
    text-shadow: 0 0 20px #ffaa00;
    animation: glowTextYellow 1.5s infinite alternate;
}
@keyframes glowTextYellow{
    from{ text-shadow: 0 0 10px #ffaa00, 0 0 20px #ffaa00; }
    to{ text-shadow: 0 0 20px #ffcc00, 0 0 40px #ffaa00, 0 0 60px #ffcc00; }
}
.success-modal.yellow .success-close-btn{
    background: linear-gradient(135deg, #ffaa00, #ffcc00);
    box-shadow: 0 4px 15px #ffaa0055;
}

/* 绿色签到 */
.day-cell.signed-green{
    background: #16a34a;
    border-color: #22c55e;
    color: #ffffff;
    box-shadow: 0 0 8px #16a34a88;
}
.success-modal.green .success-box{
    border-color: #00ffaa;
    box-shadow: 0 0 60px #00ffaa55, 0 0 100px #00aaff33;
}
.success-modal.green .success-icon{
    background: linear-gradient(135deg, #00ff88, #00ccff);
    box-shadow: 0 0 30px #00ffaa;
}
.success-modal.green .success-title{
    color: #00ffaa;
    text-shadow: 0 0 20px #00ffaa;
    animation: glowTextGreen 1.5s infinite alternate;
}
@keyframes glowTextGreen{
    from{ text-shadow: 0 0 10px #00ffaa, 0 0 20px #00ffaa; }
    to{ text-shadow: 0 0 20px #00ffcc, 0 0 40px #00ffaa, 0 0 60px #00aaff; }
}
.success-modal.green .success-close-btn{
    background: linear-gradient(135deg, #00ff88, #00ccff);
    box-shadow: 0 4px 15px #00ffaa55;
}

/* 签到确认弹窗 */
.confirm-modal{
    position: fixed;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.8);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    animation: fadeIn 0.3s ease;
    padding: 20px;
}
.confirm-modal.show{
    display: flex;
}
.confirm-box{
    width: 100%;
    max-width: 500px;
    background: linear-gradient(145deg, #1a2a4a, #0d1a30);
    border: 2px solid #0077cc;
    border-radius: 20px;
    padding: 25px 20px;
    box-shadow: 0 0 40px #0066bb44;
    animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    max-height: 85vh;
    overflow-y: auto;
}
.confirm-title{
    font-size: 20px;
    font-weight: bold;
    color: #66ddff;
    text-align: center;
    margin-bottom: 6px;
}
.confirm-date{
    font-size: 14px;
    color: #88aacc;
    text-align: center;
    margin-bottom: 18px;
}
.confirm-task-list{
    margin-bottom: 20px;
}
.confirm-task-item{
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 10px;
    border-bottom: 1px solid #00447744;
    cursor: pointer;
    transition: 0.2s;
    border-radius: 8px;
}
.confirm-task-item:hover{
    background: #00447722;
}
.confirm-task-item:last-child{
    border-bottom: none;
}
.confirm-checkbox{
    width: 22px;
    height: 22px;
    border: 2px solid #0088cc;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: 0.2s;
    background: transparent;
}
.confirm-task-item.checked .confirm-checkbox{
    background: linear-gradient(135deg, #00cc88, #00aaff);
    border-color: #00ffaa;
}
.confirm-checkbox svg{
    width: 14px;
    height: 14px;
    stroke: white;
    stroke-width: 3;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: 0;
    transition: 0.2s;
}
.confirm-task-item.checked .confirm-checkbox svg{
    opacity: 1;
}
.confirm-task-text{
    flex: 1;
    font-size: 15px;
    color: #c8d8e8;
}
.confirm-task-item.checked .confirm-task-text{
    color: #66ffaa;
    text-decoration: line-through;
    text-decoration-color: #00cc8888;
}
.confirm-task-emoji{
    font-size: 18px;
}
.confirm-progress{
    text-align: center;
    margin-bottom: 16px;
    font-size: 14px;
    color: #88aacc;
}
.confirm-progress-bar{
    height: 8px;
    background: #0a1525;
    border-radius: 4px;
    margin-bottom: 6px;
    overflow: hidden;
}
.confirm-progress-fill{
    height: 100%;
    background: linear-gradient(90deg, #ff4444, #ffaa00, #00ff88);
    border-radius: 4px;
    transition: width 0.3s ease;
}
.confirm-btns{
    display: flex;
    gap: 12px;
}
.confirm-btn{
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}
.confirm-btn.cancel{
    background: transparent;
    border: 1px solid #ff4466;
    color: #ff6680;
}
.confirm-btn.cancel:hover{
    background: #ff446622;
}
.confirm-btn.ok{
    background: linear-gradient(135deg, #00cc88, #00aaff);
    color: #001a22;
    box-shadow: 0 4px 15px #00ffaa55;
}
.confirm-btn.ok:hover{
    transform: scale(1.02);
    box-shadow: 0 6px 25px #00ffaa;
}
</style>
</head>
<body>
<h1 class="flash-title">务必坚持</h1>
<h2 class="title">超神签到系统</h2>

<!-- 签到日历卡片 -->
<div class="card">
    <div class="card-head">
        <h2>签到日历</h2>
        <div class="month-switch">
            <button class="btn" id="prevMonth">←</button>
            <span id="monthLabel"></span>
            <button class="btn" id="nextMonth">→</button>
        </div>
    </div>
    <div class="week-row">
        <div class="week-cell">周日</div>
        <div class="week-cell">周一</div>
        <div class="week-cell">周二</div>
        <div class="week-cell">周三</div>
        <div class="week-cell">周四</div>
        <div class="week-cell">周五</div>
        <div class="week-cell">周六</div>
    </div>
    <div class="date-grid" id="calendarWrap"></div>
</div>

<div class="card">
    <button class="btn task-open-btn" id="openTaskPop">查看每日必完成清单</button>
</div>

<p class="tip-text">所有签到、任务数据自动保存在本地浏览器</p>

<!-- 签到成功弹窗 -->
<div class="success-modal" id="successModal">
    <div class="success-box">
        <div class="stars" id="starsContainer"></div>
        <div class="success-icon">
            <svg viewBox="0 0 24 24">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        </div>
        <h3 class="success-title" id="successTitle">签到成功!</h3>
        <p class="success-date" id="successDate"></p>
        <p class="success-msg" id="successMsg"></p>
        <button class="success-close-btn" id="successCloseBtn">太棒了!</button>
    </div>
</div>

<!-- 签到确认弹窗 -->
<div class="confirm-modal" id="confirmModal">
    <div class="confirm-box">
        <h3 class="confirm-title">📝 今日任务完成情况</h3>
        <p class="confirm-date" id="confirmDate"></p>
        <div class="confirm-progress">
            <div class="confirm-progress-bar">
                <div class="confirm-progress-fill" id="confirmProgressFill" style="width: 0%"></div>
            </div>
            <span id="confirmProgressText">已完成 0 / 0 项 (0%)</span>
        </div>
        <div class="confirm-task-list" id="confirmTaskList"></div>
        <div class="confirm-btns">
            <button class="confirm-btn cancel" id="confirmCancelBtn">取消</button>
            <button class="confirm-btn ok" id="confirmOkBtn">确定签到</button>
        </div>
    </div>
</div>

<!-- 任务弹窗 -->
<div class="mask" id="taskMask">
    <div class="pop-box">
        <h3 class="pop-title">📋 每日硬性任务</h3>
        <div id="taskListWrap"></div>
        <div class="task-add-area">
            <input class="task-input" id="taskInput" placeholder="输入新增硬性任务">
            <button class="btn" id="addTaskBtn">添加</button>
        </div>
        <button class="btn pop-close" id="closePopBtn">关闭</button>
    </div>
</div>

<script>
// 获取真实系统年月日，年份随现实自动增长
const nowDate = new Date();
let CURRENT_YEAR = nowDate.getFullYear();
let currentMonth = nowDate.getMonth();

const SIGN_STORAGE_KEY = "signRecordAllYear";
const TASK_STORAGE_KEY = "dailyTaskList";
const TASK_DONE_KEY = "dailyTaskDoneRecord";
// 原生固定基础任务，不可删除
const baseTaskArr = [
    "精准学习4h以上",
    "单词200+",
    "深蹲10*4",
    "饮水2000ml+",
    "日消费25-",
    "少食",
    "禁欲",
    "🙅🏻‍♂️不要熬夜"
];

// 读取本地存储的新增自定义任务
let customTaskList = JSON.parse(localStorage.getItem(TASK_STORAGE_KEY)) || [];
// 完整任务 = 固定基础任务 + 用户新增任务
function getAllTask(){
    return [...baseTaskArr, ...customTaskList];
}

// 小红书风格表情库
const emojiList = ['📚','📖','💪','💧','💰','🥗','🚫','✨','⏰','🧘','🖊️','🏃'];

const monthLabel = document.getElementById("monthLabel");
const calendarWrap = document.getElementById("calendarWrap");
const prevBtn = document.getElementById("prevMonth");
const nextBtn = document.getElementById("nextMonth");
const taskListWrap = document.getElementById("taskListWrap");
const taskInput = document.getElementById("taskInput");
const addTaskBtn = document.getElementById("addTaskBtn");
const taskMask = document.getElementById("taskMask");
const openTaskPop = document.getElementById("openTaskPop");
const closePopBtn = document.getElementById("closePopBtn");

// 签到成功弹窗元素
const successModal = document.getElementById("successModal");
const successTitle = document.getElementById("successTitle");
const successDate = document.getElementById("successDate");
const successMsg = document.getElementById("successMsg");
const successCloseBtn = document.getElementById("successCloseBtn");
const starsContainer = document.getElementById("starsContainer");

// 签到确认弹窗元素
const confirmModal = document.getElementById("confirmModal");
const confirmDateEl = document.getElementById("confirmDate");
const confirmTaskListEl = document.getElementById("confirmTaskList");
const confirmProgressFill = document.getElementById("confirmProgressFill");
const confirmProgressText = document.getElementById("confirmProgressText");
const confirmCancelBtn = document.getElementById("confirmCancelBtn");
const confirmOkBtn = document.getElementById("confirmOkBtn");

let currentSignDate = "";
let currentCheckedTasks = [];

// 根据完成率获取等级
function getLevel(percent) {
    if (percent < 30) return "red";
    if (percent < 70) return "yellow";
    return "green";
}

// 获取某天的任务完成记录
function getDayDoneTasks(dateStr) {
    const all = JSON.parse(localStorage.getItem(TASK_DONE_KEY) || "{}");
    return all[dateStr] || [];
}

// 保存某天的任务完成记录
function saveDayDoneTasks(dateStr, doneArr) {
    const all = JSON.parse(localStorage.getItem(TASK_DONE_KEY) || "{}");
    if (doneArr.length > 0) {
        all[dateStr] = doneArr;
    } else {
        delete all[dateStr];
    }
    localStorage.setItem(TASK_DONE_KEY, JSON.stringify(all));
}

// 获取某天的完成率
function getDayPercent(dateStr) {
    const allTask = getAllTask();
    if (allTask.length === 0) return 0;
    const done = getDayDoneTasks(dateStr);
    return Math.round(done.length / allTask.length * 100);
}

// 不同等级的提示语
const levelMessages = {
    red: [
        "今天状态不太好，明天加油！",
        "完成度不高，但至少签到了！",
        "革命尚未成功，同志仍需努力！",
        "没关系，明天会更好！"
    ],
    yellow: [
        "还不错，继续保持！",
        "中规中矩，可以更努力！",
        "及格了，但还有进步空间！",
        "不错不错，争取全绿！"
    ],
    green: [
        "太棒了！全绿达成！",
        "超神！今日完美收官！",
        "自律的你最帅！",
        "成功人士，每日必达！",
        "优秀是一种习惯！"
    ]
};

// 显示签到成功弹窗
function showSuccessModal(dateStr, isSigned) {
    const modal = successModal;
    modal.classList.remove("red", "yellow", "green", "cancel-modal");
    
    if(isSigned){
        const percent = getDayPercent(dateStr);
        const level = getLevel(percent);
        modal.classList.add(level);
        
        const msgs = levelMessages[level];
        const msgIndex = Math.floor(Math.random() * msgs.length);
        
        successTitle.textContent = "签到成功!";
        successDate.textContent = `${dateStr}  完成度: ${percent}%`;
        successMsg.textContent = msgs[msgIndex];
        successCloseBtn.textContent = "太棒了!";
        
        const iconSvg = modal.querySelector(".success-icon svg polyline");
        iconSvg.style.display = "";
    }else{
        modal.classList.add("cancel-modal");
        successTitle.textContent = "已取消签到";
        successDate.textContent = dateStr;
        successMsg.textContent = "明天继续加油哦!";
        successCloseBtn.textContent = "知道了";
    }
    
    modal.classList.add('show');
    createStars();
    
    if(navigator.vibrate){
        navigator.vibrate(50);
    }
}

// 创建星星效果
function createStars() {
    starsContainer.innerHTML = '';
    for(let i = 0; i < 15; i++){
        const star = document.createElement('div');
        star.className = 'star';
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 100 + '%';
        star.style.animationDelay = Math.random() * 1 + 's';
        starsContainer.appendChild(star);
    }
}

// 关闭成功弹窗
successCloseBtn.onclick = () => {
    successModal.classList.remove('show');
    successModal.classList.remove('red', 'yellow', 'green', 'cancel-modal');
};
successModal.onclick = (e) => {
    if(e.target === successModal){
        successModal.classList.remove('show');
        successModal.classList.remove('red', 'yellow', 'green', 'cancel-modal');
    }
};

// 打开确认弹窗
function openConfirmModal(dateStr) {
    currentSignDate = dateStr;
    confirmDateEl.textContent = dateStr;
    
    const allTask = getAllTask();
    const doneTasks = getDayDoneTasks(dateStr);
    currentCheckedTasks = [...doneTasks];
    
    // 渲染任务列表
    confirmTaskListEl.innerHTML = "";
    allTask.forEach((taskText, index) => {
        const item = document.createElement("div");
        item.className = "confirm-task-item";
        if (doneTasks.includes(taskText)) {
            item.classList.add("checked");
        }
        
        const checkbox = document.createElement("div");
        checkbox.className = "confirm-checkbox";
        checkbox.innerHTML = '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>';
        
        const text = document.createElement("div");
        text.className = "confirm-task-text";
        text.textContent = taskText;
        
        const emoji = document.createElement("div");
        emoji.className = "confirm-task-emoji";
        emoji.textContent = emojiList[index % emojiList.length];
        
        item.appendChild(checkbox);
        item.appendChild(text);
        item.appendChild(emoji);
        
        item.onclick = () => {
            const isChecked = item.classList.toggle("checked");
            if (isChecked) {
                if (!currentCheckedTasks.includes(taskText)) {
                    currentCheckedTasks.push(taskText);
                }
            } else {
                const idx = currentCheckedTasks.indexOf(taskText);
                if (idx > -1) currentCheckedTasks.splice(idx, 1);
            }
            updateConfirmProgress();
        };
        
        confirmTaskListEl.appendChild(item);
    });
    
    updateConfirmProgress();
    confirmModal.classList.add("show");
}

// 更新确认弹窗进度
function updateConfirmProgress() {
    const total = getAllTask().length;
    const done = currentCheckedTasks.length;
    const percent = total > 0 ? Math.round(done / total * 100) : 0;
    confirmProgressFill.style.width = percent + "%";
    confirmProgressText.textContent = `已完成 ${done} / ${total} 项 (${percent}%)`;
}

// 关闭确认弹窗
function closeConfirmModal() {
    confirmModal.classList.remove("show");
    currentSignDate = "";
    currentCheckedTasks = [];
}

confirmCancelBtn.onclick = closeConfirmModal;
confirmModal.onclick = (e) => {
    if (e.target === confirmModal) closeConfirmModal();
};

// 确定签到
confirmOkBtn.onclick = () => {
    const dateStr = currentSignDate;
    if (!dateStr) return;
    
    let signRecords = JSON.parse(localStorage.getItem(SIGN_STORAGE_KEY) || "[]");
    const index = signRecords.indexOf(dateStr);
    
    if (currentCheckedTasks.length > 0) {
        // 有完成的任务，保存签到
        if (index === -1) {
            signRecords.push(dateStr);
        }
        saveDayDoneTasks(dateStr, currentCheckedTasks);
        localStorage.setItem(SIGN_STORAGE_KEY, JSON.stringify(signRecords));
        renderCalendar();
        closeConfirmModal();
        showSuccessModal(dateStr, true);
    } else {
        // 没有完成的任务，取消签到
        if (index > -1) {
            signRecords.splice(index, 1);
        }
        saveDayDoneTasks(dateStr, []);
        localStorage.setItem(SIGN_STORAGE_KEY, JSON.stringify(signRecords));
        renderCalendar();
        closeConfirmModal();
        showSuccessModal(dateStr, false);
    }
};

// 打开弹窗
openTaskPop.onclick = () => {
    taskMask.classList.add('show');
    renderTaskList();
}
// 关闭弹窗
closePopBtn.onclick = () => {
    taskMask.classList.remove('show');
}
// 点击遮罩关闭弹窗
taskMask.onclick = (e) => {
    if(e.target === taskMask) taskMask.classList.remove('show');
}

function renderCalendar(){
    calendarWrap.innerHTML = "";
    const month = currentMonth + 1;
    monthLabel.innerText = `${CURRENT_YEAR}年${month}月`;
    prevBtn.disabled = false;
    nextBtn.disabled = false;

    const firstDayWeek = new Date(CURRENT_YEAR, currentMonth, 1).getDay();
    const monthTotalDays = new Date(CURRENT_YEAR, currentMonth + 1, 0).getDate();
    let dayCount = 1;

    for(let row = 0; row < 6; row++){
        for(let col = 0; col < 7; col++){
            const cell = document.createElement("div");
            cell.className = "day-cell";

            if(row === 0 && col < firstDayWeek){
                cell.classList.add("empty-cell");
                calendarWrap.appendChild(cell);
                continue;
            }

            if(dayCount > monthTotalDays){
                cell.classList.add("empty-cell");
                calendarWrap.appendChild(cell);
                continue;
            }

            cell.innerText = dayCount;
            const dateStr = `${CURRENT_YEAR}-${String(month).padStart(2, "0")}-${String(dayCount).padStart(2, "0")}`;
            let signRecords = JSON.parse(localStorage.getItem(SIGN_STORAGE_KEY)) || [];
            if(signRecords.includes(dateStr)){
                const percent = getDayPercent(dateStr);
                const level = getLevel(percent);
                cell.classList.add("signed-" + level);
            }

            cell.onclick = () => {
                openConfirmModal(dateStr);
            };

            calendarWrap.appendChild(cell);
            dayCount++;
        }
    }
}

// 渲染任务：原生任务隐藏删除按钮，自定义任务可删
function renderTaskList(){
    taskListWrap.innerHTML = "";
    const allTask = getAllTask();
    allTask.forEach((taskText, index) => {
        const taskBox = document.createElement("div");
        taskBox.className = "task-item";

        const leftWrap = document.createElement("div");
        leftWrap.className = "task-left";

        const emojiSpan = document.createElement("span");
        emojiSpan.className = "task-emoji";
        emojiSpan.innerText = emojiList[index % emojiList.length];

        const textSpan = document.createElement("span");
        textSpan.innerText = taskText;
        leftWrap.appendChild(emojiSpan);
        leftWrap.appendChild(textSpan);

        const delBtn = document.createElement("div");
        delBtn.className = "task-del";
        delBtn.innerText = "删除";
        // 基础任务禁止删除，隐藏按钮
        if(index < baseTaskArr.length){
            delBtn.classList.add("disabled");
        }else{
            // 自定义任务下标重新计算
            const customIdx = index - baseTaskArr.length;
            delBtn.onclick = () => {
                customTaskList.splice(customIdx, 1);
                localStorage.setItem(TASK_STORAGE_KEY, JSON.stringify(customTaskList));
                renderTaskList();
            };
        }

        taskBox.appendChild(leftWrap);
        taskBox.appendChild(delBtn);
        taskListWrap.appendChild(taskBox);
    });
}

// 新增自定义任务
addTaskBtn.onclick = () => {
    const content = taskInput.value.trim();
    if(!content) return;
    customTaskList.push(content);
    localStorage.setItem(TASK_STORAGE_KEY, JSON.stringify(customTaskList));
    taskInput.value = "";
    renderTaskList();
};

// 月份切换，支持跨年
prevBtn.onclick = () => {
    currentMonth--;
    if(currentMonth < 0){
        currentMonth = 11;
        CURRENT_YEAR--;
    }
    renderCalendar();
};
nextBtn.onclick = () => {
    currentMonth++;
    if(currentMonth > 11){
        currentMonth = 0;
        CURRENT_YEAR++;
    }
    renderCalendar();
};

// 初始化渲染当月日历
renderCalendar();
</script>
