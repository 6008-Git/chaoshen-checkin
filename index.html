<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>超神签到系统</title>
<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Microsoft Yahei", sans-serif;
}
body{
    background: #0b101c;
    padding: 16px;
    color: #e6edf7;
    background-image:
        radial-gradient(rgba(0, 140, 255, 0.08) 1px, transparent 1px);
    background-size: 24px 24px;
}
/* 闪烁炫彩大标题 */
.flash-title{
    font-size: 40px;
    font-weight: 900;
    text-align: center;
    margin-bottom: 20px;
    animation: flashColor 1.2s infinite alternate;
    letter-spacing: 4px;
}
@keyframes flashColor{
    0%{
        color: #ff4757;
        text-shadow: 0 0 12px #ff4757;
    }
    25%{
        color: #ffa502;
        text-shadow: 0 0 12px #ffa502;
    }
    50%{
        color: #2ed573;
        text-shadow: 0 0 12px #2ed573;
    }
    75%{
        color: #1e90ff;
        text-shadow: 0 0 12px #1e90ff;
    }
    100%{
        color: #ff6bff;
        text-shadow: 0 0 12px #ff6bff;
    }
}
.title{
    text-align: center;
    font-size: 24px;
    margin-bottom: 20px;
    letter-spacing: 2px;
    color: #36ccff;
    text-shadow: 0 0 8px #00aaff77;
}
.card{
    background: rgba(16, 26, 48, 0.85);
    border: 1px solid #0077cc66;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 22px;
    box-shadow: 0 0 12px #0066bb33, inset 0 0 20px #00336622;
}
.card-head{
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
}
.card-head h2{
    font-size: 18px;
    color: #66ddff;
}
.month-switch{
    display: flex;
    gap: 10px;
}
.btn{
    padding: 6px 14px;
    border: 1px solid #00a0ee;
    background: transparent;
    color: #36ccff;
    border-radius: 6px;
    cursor: pointer;
    transition: 0.3s ease;
}
.btn:hover{
    background: #0088cc33;
    box-shadow: 0 0 6px #00aaff66;
}
.btn:disabled{
    border-color: #224466;
    color: #446688;
    cursor: not-allowed;
}
.task-open-btn{
    width: 100%;
    padding: 12px;
    font-size: 16px;
    margin-top: 8px;
}
.week-row{
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    margin-bottom: 8px;
}
.week-cell{
    text-align: center;
    padding: 8px 0;
    color: #88bbdd;
    font-size: 14px;
}
.date-grid{
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
}
.day-cell{
    aspect-ratio: 1;
    border: 1px solid #00559944;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: .25s;
    font-size: 15px;
}
.day-cell:hover{
    border-color: #00bfff;
    background: #00447722;
}
.day-cell.signed{
    background: #16a34a;
    border-color: #22c55e;
    color: #ffffff;
    box-shadow: 0 0 8px #16a34a88;
}
.empty-cell{
    border: none;
    cursor: default;
    background: transparent;
}
/* 弹窗遮罩层 */
.mask{
    position: fixed;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.75);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 999;
}
.mask.show{
    display: flex;
}
.pop-box{
    width: 100%;
    max-width: 500px;
    background: #101a30;
    border: 1px solid #0077cc66;
    border-radius: 14px;
    padding: 20px;
}
.pop-title{
    font-size: 18px;
    color: #66ddff;
    margin-bottom: 16px;
    text-align: center;
}
.task-item{
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 0;
    border-bottom: 1px solid #00447744;
    gap: 10px;
}
.task-item:last-child{
    border-bottom: none;
}
.task-left{
    display: flex;
    align-items: center;
    gap: 10px;
}
.task-emoji{
    font-size: 18px;
}
.task-del{
    font-size: 13px;
    padding: 4px 10px;
    border: 1px solid #ff4466;
    color: #ff6680;
    border-radius: 4px;
    cursor: pointer;
}
.task-del.disabled{
    visibility: hidden;
}
.task-add-area{
    display: flex;
    gap: 10px;
    margin-top: 16px;
}
.task-input{
    flex: 1;
    padding: 9px 12px;
    background: #0f1a30;
    border: 1px solid #0066aa77;
    border-radius: 6px;
    color: #e6edf7;
    outline: none;
}
.task-input:focus{
    border-color: #00ccff;
    box-shadow: 0 0 5px #00aaff55;
}
.pop-close{
    width: 100%;
    margin-top: 20px;
}
.tip-text{
    text-align: center;
    margin-top: 10px;
    font-size: 13px;
    color: #6688aa;
}

/* 签到成功弹窗 */
.success-modal{
    position: fixed;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.8);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    animation: fadeIn 0.3s ease;
}
.success-modal.show{
    display: flex;
}
@keyframes fadeIn{
    from{ opacity: 0; }
    to{ opacity: 1; }
}
.success-box{
    background: linear-gradient(145deg, #1a2a4a, #0d1a30);
    border: 2px solid #00ffaa;
    border-radius: 20px;
    padding: 40px 30px;
    text-align: center;
    box-shadow: 0 0 60px #00ffaa55, 0 0 100px #00aaff33;
    animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    position: relative;
    overflow: hidden;
}
@keyframes popIn{
    0%{ transform: scale(0.5); opacity: 0; }
    100%{ transform: scale(1); opacity: 1; }
}
.success-icon{
    width: 80px;
    height: 80px;
    margin: 0 auto 20px;
    background: linear-gradient(135deg, #00ff88, #00ccff);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: pulse 1s infinite, rotateGlow 2s infinite linear;
    box-shadow: 0 0 30px #00ffaa;
}
@keyframes pulse{
    0%, 100%{ transform: scale(1); }
    50%{ transform: scale(1.1); }
}
@keyframes rotateGlow{
    0%{ box-shadow: 0 0 30px #00ffaa, 0 0 60px #00aaff; }
    50%{ box-shadow: 0 0 50px #00ffcc, 0 0 80px #00ccff; }
    100%{ box-shadow: 0 0 30px #00ffaa, 0 0 60px #00aaff; }
}
.success-icon svg{
    width: 45px;
    height: 45px;
    stroke: white;
    stroke-width: 3;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    animation: drawCheck 0.5s ease 0.3s forwards;
    stroke-dasharray: 50;
    stroke-dashoffset: 50;
}
@keyframes drawCheck{
    to{ stroke-dashoffset: 0; }
}
.success-title{
    font-size: 28px;
    font-weight: 900;
    color: #00ffaa;
    text-shadow: 0 0 20px #00ffaa;
    margin-bottom: 10px;
    animation: glowText 1.5s infinite alternate;
}
@keyframes glowText{
    from{ text-shadow: 0 0 10px #00ffaa, 0 0 20px #00ffaa; }
    to{ text-shadow: 0 0 20px #00ffcc, 0 0 40px #00ffaa, 0 0 60px #00aaff; }
}
.success-date{
    font-size: 16px;
    color: #88ccff;
    margin-bottom: 15px;
}
.success-msg{
    font-size: 14px;
    color: #aabbcc;
    margin-bottom: 25px;
    line-height: 1.6;
}
.success-close-btn{
    padding: 12px 40px;
    background: linear-gradient(135deg, #00ff88, #00ccff);
    border: none;
    border-radius: 25px;
    color: #001a22;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
    box-shadow: 0 4px 15px #00ffaa55;
}
.success-close-btn:hover{
    transform: scale(1.05);
    box-shadow: 0 6px 25px #00ffaa;
}

/* 粒子效果 */
.particle{
    position: absolute;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    animation: particleFly 1s ease-out forwards;
}
@keyframes particleFly{
    0%{ transform: translate(0, 0) scale(1); opacity: 1; }
    100%{ transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
}

/* 星星闪烁 */
.stars{
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    overflow: hidden;
}
.star{
    position: absolute;
    width: 4px;
    height: 4px;
    background: #fff;
    border-radius: 50%;
    animation: twinkle 1s infinite;
}
@keyframes twinkle{
    0%, 100%{ opacity: 0.3; transform: scale(1); }
    50%{ opacity: 1; transform: scale(1.5); }
}

/* 取消签到的提示 */
.cancel-modal .success-box{
    border-color: #ff6b6b;
    box-shadow: 0 0 60px #ff6b6b55;
}
.cancel-modal .success-icon{
    background: linear-gradient(135deg, #ff6b6b, #ff8e53);
    box-shadow: 0 0 30px #ff6b6b;
}
.cancel-modal .success-title{
    color: #ff6b6b;
    text-shadow: 0 0 20px #ff6b6b;
}
.cancel-modal .success-close-btn{
    background: linear-gradient(135deg, #ff6b6b, #ff8e53);
    box-shadow: 0 4px 15px #ff6b6b55;
}

/* 提醒设置卡片 */
.remind-card{
    background: rgba(16, 26, 48, 0.85);
    border: 1px solid #0077cc66;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 22px;
    box-shadow: 0 0 12px #0066bb33, inset 0 0 20px #00336622;
}
.remind-head{
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
}
.remind-head h2{
    font-size: 18px;
    color: #66ddff;
}
.remind-status{
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 10px;
    margin-left: auto;
}
.remind-status.on{
    background: #16a34a33;
    color: #4ade80;
    border: 1px solid #22c55e66;
}
.remind-status.off{
    background: #ff446622;
    color: #ff6680;
    border: 1px solid #ff446666;
}
.remind-row{
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
}
.remind-row label{
    font-size: 14px;
    color: #88bbdd;
}
.time-picker{
    display: flex;
    align-items: center;
    gap: 6px;
}
.time-input{
    width: 56px;
    padding: 8px 6px;
    background: #0f1a30;
    border: 1px solid #0066aa77;
    border-radius: 8px;
    color: #e6edf7;
    font-size: 18px;
    text-align: center;
    outline: none;
}
.time-input:focus{
    border-color: #00ccff;
    box-shadow: 0 0 8px #00aaff55;
}
.time-sep{
    font-size: 22px;
    color: #66ddff;
    font-weight: bold;
}
.remind-btns{
    display: flex;
    gap: 10px;
    margin-left: auto;
}
.btn-remind{
    padding: 8px 18px;
    border: 1px solid #00a0ee;
    background: transparent;
    color: #36ccff;
    border-radius: 6px;
    cursor: pointer;
    transition: 0.3s ease;
    font-size: 14px;
}
.btn-remind:hover{
    background: #0088cc33;
    box-shadow: 0 0 6px #00aaff66;
}
.btn-remind.save{
    background: linear-gradient(135deg, #00cc88, #00aaff);
    border: none;
    color: #001a22;
    font-weight: bold;
}
.btn-remind.save:hover{
    box-shadow: 0 0 12px #00ffaa;
}
.btn-remind.cancel{
    border-color: #ff4466;
    color: #ff6680;
}
.btn-remind.cancel:hover{
    background: #ff446622;
}
.btn-notify{
    width: 100%;
    padding: 10px;
    margin-top: 12px;
    font-size: 14px;
    border-radius: 8px;
    border: 1px solid #ffa50088;
    color: #ffc04d;
    background: transparent;
    cursor: pointer;
    transition: 0.3s;
}
.btn-notify:hover{
    background: #ffa50022;
    box-shadow: 0 0 8px #ffa50066;
}
.btn-notify.granted{
    border-color: #22c55e66;
    color: #4ade80;
    cursor: default;
    opacity: 0.6;
}
.btn-notify.granted:hover{
    background: transparent;
    box-shadow: none;
}
.remind-tip{
    font-size: 12px;
    color: #5577aa;
    margin-top: 10px;
    line-height: 1.5;
}
</style>
</head>
<body>
<h1 class="flash-title">务必坚持</h1>
<h2 class="title">超神签到系统</h2>

<!-- 签到日历卡片 -->
<div class="card">
    <div class="card-head">
        <h2>签到日历</h2>
        <div class="month-switch">
            <button class="btn" id="prevMonth">←</button>
            <span id="monthLabel"></span>
            <button class="btn" id="nextMonth">→</button>
        </div>
    </div>
    <div class="week-row">
        <div class="week-cell">周日</div>
        <div class="week-cell">周一</div>
        <div class="week-cell">周二</div>
        <div class="week-cell">周三</div>
        <div class="week-cell">周四</div>
        <div class="week-cell">周五</div>
        <div class="week-cell">周六</div>
    </div>
    <div class="date-grid" id="calendarWrap"></div>
</div>

<div class="card">
    <button class="btn task-open-btn" id="openTaskPop">查看每日必完成清单</button>
</div>

<!-- 每日提醒设置 -->
<div class="remind-card">
    <div class="remind-head">
        <h2>⏰ 每日签到提醒</h2>
        <span class="remind-status off" id="remindStatus">未设置</span>
    </div>
    <div class="remind-row">
        <label>提醒时间</label>
        <div class="time-picker">
            <input class="time-input" id="remindHour" type="number" min="0" max="23" value="08" placeholder="时">
            <span class="time-sep">:</span>
            <input class="time-input" id="remindMin" type="number" min="0" max="59" value="00" placeholder="分">
        </div>
        <div class="remind-btns">
            <button class="btn-remind save" id="saveRemind">保存</button>
            <button class="btn-remind cancel" id="cancelRemind">取消提醒</button>
        </div>
    </div>
    <button class="btn-notify" id="notifyPermBtn">开启浏览器通知权限</button>
    <p class="remind-tip">到达设定时间后，浏览器会推送桌面通知提醒你签到。需保持页面打开（可最小化），并授权通知权限。</p>
</div>

<p class="tip-text">所有签到、任务数据自动保存在本地浏览器</p>

<!-- 签到成功弹窗 -->
<div class="success-modal" id="successModal">
    <div class="success-box">
        <div class="stars" id="starsContainer"></div>
        <div class="success-icon">
            <svg viewBox="0 0 24 24">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        </div>
        <h3 class="success-title" id="successTitle">签到成功!</h3>
        <p class="success-date" id="successDate"></p>
        <p class="success-msg" id="successMsg"></p>
        <button class="success-close-btn" id="successCloseBtn">太棒了!</button>
    </div>
</div>

<!-- 任务弹窗 -->
<div class="mask" id="taskMask">
    <div class="pop-box">
        <h3 class="pop-title">📋 每日硬性任务</h3>
        <div id="taskListWrap"></div>
        <div class="task-add-area">
            <input class="task-input" id="taskInput" placeholder="输入新增硬性任务">
            <button class="btn" id="addTaskBtn">添加</button>
        </div>
        <button class="btn pop-close" id="closePopBtn">关闭</button>
    </div>
</div>

<script>
// 获取真实系统年月日，年份随现实自动增长
const nowDate = new Date();
let CURRENT_YEAR = nowDate.getFullYear();
let currentMonth = nowDate.getMonth();

const SIGN_STORAGE_KEY = "signRecordAllYear";
const TASK_STORAGE_KEY = "dailyTaskList";
// 原生固定基础任务，不可删除
const baseTaskArr = [
    "精准学习4h以上",
    "单词200+",
    "深蹲10*4",
    "饮水2000ml+",
    "日消费25-",
    "少食",
    "禁欲"
];

// 读取本地存储的新增自定义任务
let customTaskList = JSON.parse(localStorage.getItem(TASK_STORAGE_KEY)) || [];
// 完整任务 = 固定基础任务 + 用户新增任务
function getAllTask(){
    return [...baseTaskArr, ...customTaskList];
}

// 小红书风格表情库
const emojiList = ['📚','📖','💪','💧','💰','🥗','🚫','✨','⏰','🧘','🖊️','🏃'];

const monthLabel = document.getElementById("monthLabel");
const calendarWrap = document.getElementById("calendarWrap");
const prevBtn = document.getElementById("prevMonth");
const nextBtn = document.getElementById("nextMonth");
const taskListWrap = document.getElementById("taskListWrap");
const taskInput = document.getElementById("taskInput");
const addTaskBtn = document.getElementById("addTaskBtn");
const taskMask = document.getElementById("taskMask");
const openTaskPop = document.getElementById("openTaskPop");
const closePopBtn = document.getElementById("closePopBtn");

// 签到成功弹窗元素
const successModal = document.getElementById("successModal");
const successTitle = document.getElementById("successTitle");
const successDate = document.getElementById("successDate");
const successMsg = document.getElementById("successMsg");
const successCloseBtn = document.getElementById("successCloseBtn");
const starsContainer = document.getElementById("starsContainer");

// 签到成功提示语数组
const successMessages = [
    "坚持就是胜利，你做到了!",
    "每一天的努力，都是成功的积累!",
    "自律的人生，注定不凡!",
    "超神之路，始于今日签到!",
    "保持自律，你会越来越强!",
    "今日事今日毕，真棒!",
    "成功人士，从不懈怠!",
    "坚持打卡，未来可期!"
];

// 显示签到成功弹窗
function showSuccessModal(dateStr, isSigned) {
    const modal = successModal;
    const box = modal.querySelector('.success-box');
    
    // 根据签到/取消设置样式
    if(isSigned){
        modal.classList.remove('cancel-modal');
        successTitle.textContent = "签到成功!";
        successCloseBtn.textContent = "太棒了!";
        const msgIndex = Math.floor(Math.random() * successMessages.length);
        successMsg.textContent = successMessages[msgIndex];
    }else{
        modal.classList.add('cancel-modal');
        successTitle.textContent = "已取消签到";
        successCloseBtn.textContent = "知道了";
        successMsg.textContent = "明天继续加油哦!";
    }
    
    successDate.textContent = dateStr;
    modal.classList.add('show');
    
    // 生成星星效果
    createStars();
    
    // 震动反馈（如果支持）
    if(navigator.vibrate){
        navigator.vibrate(50);
    }
}

// 创建星星效果
function createStars() {
    starsContainer.innerHTML = '';
    for(let i = 0; i < 15; i++){
        const star = document.createElement('div');
        star.className = 'star';
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 100 + '%';
        star.style.animationDelay = Math.random() * 1 + 's';
        starsContainer.appendChild(star);
    }
}

// 关闭成功弹窗
successCloseBtn.onclick = () => {
    successModal.classList.remove('show');
    successModal.classList.remove('cancel-modal');
};
successModal.onclick = (e) => {
    if(e.target === successModal){
        successModal.classList.remove('show');
        successModal.classList.remove('cancel-modal');
    }
};

// 打开弹窗
openTaskPop.onclick = () => {
    taskMask.classList.add('show');
    renderTaskList();
}
// 关闭弹窗
closePopBtn.onclick = () => {
    taskMask.classList.remove('show');
}
// 点击遮罩关闭弹窗
taskMask.onclick = (e) => {
    if(e.target === taskMask) taskMask.classList.remove('show');
}

function renderCalendar(){
    calendarWrap.innerHTML = "";
    const month = currentMonth + 1;
    monthLabel.innerText = `${CURRENT_YEAR}年${month}月`;
    prevBtn.disabled = false;
    nextBtn.disabled = false;

    const firstDayWeek = new Date(CURRENT_YEAR, currentMonth, 1).getDay();
    const monthTotalDays = new Date(CURRENT_YEAR, currentMonth + 1, 0).getDate();
    let dayCount = 1;

    for(let row = 0; row < 6; row++){
        for(let col = 0; col < 7; col++){
            const cell = document.createElement("div");
            cell.className = "day-cell";

            if(row === 0 && col < firstDayWeek){
                cell.classList.add("empty-cell");
                calendarWrap.appendChild(cell);
                continue;
            }

            if(dayCount > monthTotalDays){
                cell.classList.add("empty-cell");
                calendarWrap.appendChild(cell);
                continue;
            }

            cell.innerText = dayCount;
            const dateStr = `${CURRENT_YEAR}-${String(month).padStart(2, "0")}-${String(dayCount).padStart(2, "0")}`;
            // 读取全年签到记录
            let signRecords = JSON.parse(localStorage.getItem(SIGN_STORAGE_KEY)) || [];
            if(signRecords.includes(dateStr)){
                cell.classList.add("signed");
            }

            cell.onclick = () => {
                let signRecords = JSON.parse(localStorage.getItem(SIGN_STORAGE_KEY)) || [];
                const index = signRecords.indexOf(dateStr);
                let isSigned = false;
                if(index > -1){
                    signRecords.splice(index, 1);
                    isSigned = false;
                }else{
                    signRecords.push(dateStr);
                    isSigned = true;
                }
                localStorage.setItem(SIGN_STORAGE_KEY, JSON.stringify(signRecords));
                renderCalendar();
                // 显示签到成功/取消弹窗
                showSuccessModal(dateStr, isSigned);
            };

            calendarWrap.appendChild(cell);
            dayCount++;
        }
    }
}

// 渲染任务：原生任务隐藏删除按钮，自定义任务可删
function renderTaskList(){
    taskListWrap.innerHTML = "";
    const allTask = getAllTask();
    allTask.forEach((taskText, index) => {
        const taskBox = document.createElement("div");
        taskBox.className = "task-item";

        const leftWrap = document.createElement("div");
        leftWrap.className = "task-left";

        const emojiSpan = document.createElement("span");
        emojiSpan.className = "task-emoji";
        emojiSpan.innerText = emojiList[index % emojiList.length];

        const textSpan = document.createElement("span");
        textSpan.innerText = taskText;
        leftWrap.appendChild(emojiSpan);
        leftWrap.appendChild(textSpan);

        const delBtn = document.createElement("div");
        delBtn.className = "task-del";
        delBtn.innerText = "删除";
        // 基础任务禁止删除，隐藏按钮
        if(index < baseTaskArr.length){
            delBtn.classList.add("disabled");
        }else{
            // 自定义任务下标重新计算
            const customIdx = index - baseTaskArr.length;
            delBtn.onclick = () => {
                customTaskList.splice(customIdx, 1);
                localStorage.setItem(TASK_STORAGE_KEY, JSON.stringify(customTaskList));
                renderTaskList();
            };
        }

        taskBox.appendChild(leftWrap);
        taskBox.appendChild(delBtn);
        taskListWrap.appendChild(taskBox);
    });
}

// 新增自定义任务
addTaskBtn.onclick = () => {
    const content = taskInput.value.trim();
    if(!content) return;
    customTaskList.push(content);
    localStorage.setItem(TASK_STORAGE_KEY, JSON.stringify(customTaskList));
    taskInput.value = "";
    renderTaskList();
};

// 月份切换，支持跨年
prevBtn.onclick = () => {
    currentMonth--;
    if(currentMonth < 0){
        currentMonth = 11;
        CURRENT_YEAR--;
    }
    renderCalendar();
};
nextBtn.onclick = () => {
    currentMonth++;
    if(currentMonth > 11){
        currentMonth = 0;
        CURRENT_YEAR++;
    }
    renderCalendar();
};

// 初始化渲染当月日历
renderCalendar();

// ===== 每日提醒功能 =====
const REMIND_KEY = "remindTime";
const REMIND_TRIGGERED_KEY = "remindTriggeredDate";
const remindHourInput = document.getElementById("remindHour");
const remindMinInput = document.getElementById("remindMin");
const saveRemindBtn = document.getElementById("saveRemind");
const cancelRemindBtn = document.getElementById("cancelRemind");
const remindStatusEl = document.getElementById("remindStatus");
const notifyPermBtn = document.getElementById("notifyPermBtn");

// 读取已保存的提醒时间
function loadRemindTime() {
    const saved = localStorage.getItem(REMIND_KEY);
    if (saved) {
        const parts = saved.split(":");
        remindHourInput.value = parts[0].padStart(2, "0");
        remindMinInput.value = parts[1].padStart(2, "0");
        updateRemindStatus(true);
    } else {
        updateRemindStatus(false);
    }
    updateNotifyBtn();
}

// 更新提醒状态标签
function updateRemindStatus(active) {
    if (active) {
        remindStatusEl.textContent = "已开启";
        remindStatusEl.className = "remind-status on";
    } else {
        remindStatusEl.textContent = "未设置";
        remindStatusEl.className = "remind-status off";
    }
}

// 更新通知权限按钮状态
function updateNotifyBtn() {
    if (!("Notification" in window)) {
        notifyPermBtn.textContent = "浏览器不支持通知";
        notifyPermBtn.classList.add("granted");
        return;
    }
    if (Notification.permission === "granted") {
        notifyPermBtn.textContent = "通知权限已开启";
        notifyPermBtn.classList.add("granted");
    } else if (Notification.permission === "denied") {
        notifyPermBtn.textContent = "通知权限被拒绝（请在浏览器设置中手动开启）";
        notifyPermBtn.classList.add("granted");
    } else {
        notifyPermBtn.textContent = "开启浏览器通知权限";
        notifyPermBtn.classList.remove("granted");
    }
}

// 请求通知权限
notifyPermBtn.onclick = () => {
    if (!("Notification" in window)) return;
    if (Notification.permission === "granted") return;
    Notification.requestPermission().then(perm => {
        updateNotifyBtn();
        if (perm === "granted") {
            new Notification("超神签到系统", {
                body: "通知权限已开启，每日到点将提醒你签到！",
                icon: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏰</text></svg>"
            });
        }
    });
};

// 保存提醒时间
saveRemindBtn.onclick = () => {
    let h = parseInt(remindHourInput.value) || 0;
    let m = parseInt(remindMinInput.value) || 0;
    h = Math.max(0, Math.min(23, h));
    m = Math.max(0, Math.min(59, m));
    remindHourInput.value = String(h).padStart(2, "0");
    remindMinInput.value = String(m).padStart(2, "0");
    localStorage.setItem(REMIND_KEY, `${h}:${m}`);
    // 重置今日触发标记，让新时间生效
    localStorage.removeItem(REMIND_TRIGGERED_KEY);
    updateRemindStatus(true);
    // 自动请求通知权限
    if ("Notification" in window && Notification.permission === "default") {
        Notification.requestPermission().then(() => updateNotifyBtn());
    }
};

// 取消提醒
cancelRemindBtn.onclick = () => {
    localStorage.removeItem(REMIND_KEY);
    localStorage.removeItem(REMIND_TRIGGERED_KEY);
    remindHourInput.value = "08";
    remindMinInput.value = "00";
    updateRemindStatus(false);
};

// 每秒检查是否到达提醒时间
function checkRemind() {
    const saved = localStorage.getItem(REMIND_KEY);
    if (!saved) return;

    const now = new Date();
    const curH = now.getHours();
    const curM = now.getMinutes();
    const curS = now.getSeconds();
    const parts = saved.split(":");
    const targetH = parseInt(parts[0]);
    const targetM = parseInt(parts[1]);

    const todayStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}`;
    const triggered = localStorage.getItem(REMIND_TRIGGERED_KEY);

    // 到达目标时间且今天还没触发过
    if (curH === targetH && curM === targetM && curS < 2 && triggered !== todayStr) {
        localStorage.setItem(REMIND_TRIGGERED_KEY, todayStr);
        sendRemindNotification();
    }
}

// 发送浏览器通知
function sendRemindNotification() {
    if (!("Notification" in window)) return;

    if (Notification.permission === "granted") {
        const n = new Notification("超神签到系统 - 签到提醒!", {
            body: "该签到了！坚持每日打卡，成就超神之路！",
            icon: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>",
            requireInteraction: true,
            tag: "chaoshen-remind"
        });
        n.onclick = () => {
            window.focus();
            n.close();
        };
    }

    // 同时震动
    if (navigator.vibrate) {
        navigator.vibrate([200, 100, 200]);
    }
}

// 启动定时检查，每秒一次
setInterval(checkRemind, 1000);

// 初始化加载
loadRemindTime();
</script>
